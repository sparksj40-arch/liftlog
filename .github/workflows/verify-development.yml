name: Verify development and package OCR
on:
  push:
    branches: ['development/v2.1']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Package pinned local OCR assets
        run: python tools/prepare_ocr.py
      - name: Verify OCR assets
        run: python tools/verify_ocr.py
      - name: Run regression and migration tests
        run: python -u tests/run_all.py
      - name: Test actual OCR without external HTTP requests
        run: python -u tests/browser_ocr.py
      - name: Assemble static release candidate
        run: python tools/package_release.py
      - name: Upload static release candidate (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: liftlog-static-release-candidate
          path: _site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
