name: Verify development and package OCR
on:
  push:
    branches: ['development/v2.1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Package pinned local OCR assets
        run: python tools/prepare_ocr.py
      - name: Verify OCR assets
        run: python tools/verify_ocr.py
      - name: Run regression and migration tests
        run: python -u tests/run_all.py
      - name: Upload static OCR assets for release packaging
        uses: actions/upload-artifact@v4
        with:
          name: verified-ocr-assets
          path: ocr-assets/
          if-no-files-found: error
          retention-days: 14
