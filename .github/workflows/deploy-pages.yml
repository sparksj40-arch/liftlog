name: Deploy verified Personal Dashboard
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY V2.1 after owner approval and private backup'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY V2.1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Prepare and verify pinned OCR assets
        run: |
          python tools/prepare_ocr.py
          python tools/verify_ocr.py
      - name: Verify release
        run: |
          python -u tests/run_all.py
          python -u tests/browser_ocr.py
      - name: Build allowlisted static site
        run: python tools/package_release.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY V2.1'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested static artifact
        id: deployment
        uses: actions/deploy-pages@v4
